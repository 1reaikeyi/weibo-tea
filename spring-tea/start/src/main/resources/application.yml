server:
  port: 8080

spring:
  application:
    name: weibo
  profiles:
    active: dev
  # 数据库配置
  datasource:
    driver-class-name: ${weibo.datasource.driver-class-name}
    url: jdbc:mysql://${weibo.datasource.host}:${weibo.datasource.port}/${weibo.datasource.database}
    username: ${weibo.datasource.userName}
    password: ${weibo.datasource.password}
  # redis配置
  data:
    redis:
      host: ${weibo.redis.host}
      port: ${weibo.redis.port}
      password: ${weibo.redis.password}
      database: ${weibo.redis.database}
      timeout: 3000ms
      redisson:
        config: |
          singleServerConfig:
            # Redis 连接地址（必须带 redis:// 协议前缀）
            address: "redis://${weibo.redis.host}:${weibo.redis.port}"
            # 数据库索引
            database: ${weibo.redis.database}
            # 访问密码
            password: ${weibo.redis.password}
            # 连接池大小
            connectionPoolSize: 10
            # 最小空闲连接数
            connectionMinimumIdleSize: 2
            # 连接空闲超时（毫秒），超时后关闭空闲连接
            idleConnectionTimeout: 10000
            # 连接建立超时（毫秒）
            connectTimeout: 10000
            # 命令执行超时（毫秒）
            timeout: 3000
            # 命令失败重试次数
            retryAttempts: 3
            # 命令失败重试间隔（毫秒）
            retryInterval: 1500

  # 邮箱配置
  mail:
    host: smtp.qq.com
    port: 465                # SSL加密端口
    username: ${weibo.email.username}
    password: ${weibo.email.password}
    properties:
      mail:
        smtp:
          auth: true         # 开启认证
          ssl:
            enable: true     # 开启SSL加密
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  # servlet配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
# mybatis-plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    # 主键策略
    db-config:
      id-type: auto
      update-strategy: not_null
logging:
  level:
    sql: debug
    io.lettuce.core: debug
# alioss配置
alioss:
  endpoint: ${weibo.endpoint}
  access-key-id: ${weibo.access-key-id}
  access-key-secret: ${weibo.access-key-secret}
  bucket-name: ${weibo.bucket-name}
# jwt配置
jwt:
  # 设置jwt签名加密时使用的秘钥
  secret-key: huawei_secret_for_spring_security_generation_as_jwt_to_use
  # 设置jwt过期时间
  ttlMillis: 864000000
  # 设置前端传递过来的令牌名称
  token-name: token

